
# The panel's own site config defines regex locations for js/css/images to set
# cache headers, and in nginx a REGEX location beats the prefix `location /`.
# Every asset was therefore served with no authentication at all. This include is
# evaluated before those blocks, so this regex wins.
location ~* \.(js|css|map|gif|jpe?g|png|bmp|svg|ico|webp|woff2?|ttf|eot)$ {
    auth_basic "hCaptcha Monitor";
    auth_basic_user_file /www/server/nginx/conf/.monitor_htpasswd;
    expires 12h;
    try_files $uri =404;
}
# hCaptcha Monitor -- both the SPA and its API sit behind one HTTP Basic gate.
#
# Deployed to:
#   /www/server/panel/vhost/nginx/extension/154.36.178.187/hcaptcha_monitor.conf
# and pulled in by the port-80 site (root /www/wwwroot/dist, the built SPA).
#
# WHY THE GATE IS HERE AND NOT IN THE ROUTER
#
# `src/router/guards/beforeEach.ts` disables the login check and assigns a
# placeholder token. That is fine, because a Vue router guard is not a boundary --
# it runs in the visitor's browser. Before this file existed, `/api/logs/*`
# answered 200 to plain curl with no credentials at all:
#
#   curl http://<host>/api/logs/overview   -> 200, live solve statistics
#   curl http://<host>/api/logs/tokens     -> 200, token usage
#   curl -X POST http://<host>/api/logs/cleanup -> 200, deletes logs
#
# Re-enabling the router guard would not have changed any of those. The gate has
# to sit in front of the proxy, which is what this does.
#
# CREDENTIALS
#
# /www/server/nginx/conf/.monitor_htpasswd -- NOT in this repository, and it must
# not be. Create or rotate it with:
#
#   printf 'neverland:%s\n' "$(openssl passwd -apr1 'THE-PASSWORD')" \
#     > /www/server/nginx/conf/.monitor_htpasswd && nginx -s reload
#
# It lives under the nginx conf dir on purpose. The first attempt put it in
# /www/server/panel/vhost/nginx/, where authenticated requests returned 500 and
# the error log said "Permission denied" -- not the file's mode but the
# DIRECTORY's: /www/server/panel/vhost is drw------- with no execute bit, so the
# worker cannot traverse into it.
#
# OUT OF SCOPE ON PURPOSE
#
# The hCaptcha solve API on :43333 is a different server block and is untouched.
# It carries its own token auth and callers must keep reaching it.

location ^~ /api/ {
    auth_basic "hCaptcha Monitor";
    auth_basic_user_file /www/server/nginx/conf/.monitor_htpasswd;

    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

location / {
    auth_basic "hCaptcha Monitor";
    auth_basic_user_file /www/server/nginx/conf/.monitor_htpasswd;

    # The SPA shell must never be cached. Asset filenames carry a content hash and
    # can be cached for a long time, but index.html is what POINTS at them -- a
    # cached shell keeps loading the previous build's bundles, which is how a
    # deploy silently fails to take effect. It cost a round of "the fix is not
    # working" when the fix was already on disk.
    add_header Cache-Control "no-cache, must-revalidate" always;

    try_files $uri $uri/ /index.html;
}
