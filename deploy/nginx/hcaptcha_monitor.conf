# hCaptcha Monitor, served ONLY under /hcp_solver/.
#
# Deployed to:
#   /www/server/panel/vhost/nginx/extension/154.36.178.187/hcaptcha_monitor.conf
#
# WHY THE PREFIX ALSO COVERS THE API
#
# HTTP Basic auth was removed at the operator's request on 2026-08-10 -- it prompted
# on every poll and was disruptive. What replaces it is obscurity, and obscurity is
# only worth anything if it covers the thing that actually serves data. Before any of
# this, /api/logs/* answered 200 to plain curl with no credentials:
#
#   curl http://<host>/api/logs/overview        -> 200, live solve statistics
#   curl http://<host>/api/logs/tokens          -> 200, token usage
#   curl -X POST http://<host>/api/logs/cleanup -> 200, deletes logs
#
# Moving only the panel would have left all of that open, so the API moved under the
# same prefix and the bare /api/ is refused outright.
#
# CHANGING THE PREFIX MEANS REBUILDING THE PANEL
#
# The SPA is built with VITE_BASE_URL and VITE_API_URL set to this prefix, so its
# asset and XHR paths carry it (`src="/hcp_solver/assets/index-*.js"`). Editing this
# file alone gives a 404 on every asset.
#
#   .env.production:  VITE_BASE_URL = /<prefix>/   VITE_API_URL = /<prefix>/
#   npm run build, then ship dist/ to /www/wwwroot/dist
#
# THIS IS OBSCURITY, NOT AUTHENTICATION
#
# The path is the only credential: no second factor if it leaks through a screenshot,
# browser history, a proxy log or a shared machine, and the site is plain HTTP so the
# path itself travels in the clear. An IP allowlist is the cheap way to add a real
# boundary without a prompt.
#
# The hCaptcha solve API on :43333 is a different server block and is untouched.

location ^~ /hcp_solver/api/ {
    rewrite ^/hcp_solver/(api/.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# The old unprefixed API path. Closed, not merely unlinked.
location ^~ /api/ {
    return 404;
}

location ^~ /hcp_solver/ {
    alias /www/wwwroot/dist/;

    # The SPA shell must never be cached: asset names carry a content hash, but
    # index.html is what POINTS at them, so a cached shell keeps loading the previous
    # deploy's bundles. That cost a round of "the fix is not working" once already.
    add_header Cache-Control "no-cache, must-revalidate" always;

    try_files $uri $uri/ /hcp_solver/index.html;
}

location / {
    return 404;
}
